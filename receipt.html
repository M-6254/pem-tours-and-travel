<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generate Receipt — PEM TOURS &amp; Travellers</title>
<meta name="description" content="Generate and print official receipts for PEM TOURS car hire and tour package clients." />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#7B2FBE; --purple2:#a855f7; --purple3:#c084fc;
  --green:#1a3d22;  --green2:#2d6b2d;  --green3:#3d8b3d;
  --cream:#f5f0ff;  --sand:#fdf9f3;   --dark:#0d0d1a;
  --ink:#1a1a2e;    --muted:#6b6b8a;  --white:#fff;
  --gold:#c9a227;
  --radius:14px;
  --shadow:0 8px 40px rgba(123,47,190,0.15);
  --navh:66px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
html{scroll-behavior:smooth;}
body{font-family:'Jost',sans-serif;background:var(--cream);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:'Jost',sans-serif;cursor:pointer;}
input,select,textarea{font-family:'Jost',sans-serif;}

/* ============================================================
   NAV
   ============================================================ */
nav{
  position:sticky;top:0;z-index:50;height:var(--navh);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;
  background:rgba(8,3,20,0.96);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(123,47,190,0.22);
}
.nav-logo{display:flex;align-items:center;gap:10px;}
.nav-logo-text .pem{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.08rem;color:#fff;letter-spacing:.03em;line-height:1.1;}
.nav-logo-text .tours{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--purple3);margin-top:2px;}
.nav-links{display:flex;align-items:center;gap:22px;}
.nav-links a{color:rgba(255,255,255,.72);font-size:.76rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;transition:color .2s;}
.nav-links a:hover{color:var(--purple2);}
.nav-links a.nav-cta{
  background:linear-gradient(135deg,var(--purple),var(--green2));
  color:#fff!important;padding:9px 18px;border-radius:6px;font-weight:700;
}
@media(max-width:860px){
  .nav-links a:not(.nav-cta){display:none;}
  nav{padding:0 18px;}
}

/* ============================================================
   APP LAYOUT
   ============================================================ */
.receipt-app{display:flex;align-items:flex-start;}

.receipt-panel{
  width:400px;flex-shrink:0;background:var(--white);
  padding:26px 24px 70px;
  max-height:calc(100vh - var(--navh));overflow-y:auto;
  border-right:1px solid rgba(123,47,190,.12);
}
.rp-title{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:700;color:var(--ink);}
.rp-sub{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px;margin-bottom:20px;}

.mode-bar{display:flex;gap:8px;margin-bottom:22px;background:var(--cream);padding:5px;border-radius:10px;}
.mode-btn{
  flex:1;padding:10px 8px;border:none;border-radius:7px;background:transparent;
  color:var(--muted);font-weight:600;font-size:.82rem;transition:all .2s;
}
.mode-btn.active{background:var(--white);color:var(--purple);box-shadow:0 2px 8px rgba(123,47,190,.18);}

.rp-sec{margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid #eee;}
.rp-sec:last-of-type{border-bottom:none;}
.rp-sec-lbl{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);font-weight:700;margin-bottom:12px;}

.rp-field{margin-bottom:12px;}
.rp-field label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:5px;font-weight:500;}
.rp-field input,.rp-field select,.rp-field textarea{
  width:100%;padding:9px 11px;border:1px solid #e2ddf0;border-radius:8px;
  font-size:.88rem;color:var(--ink);background:var(--white);transition:border-color .2s;
}
.rp-field input:focus,.rp-field select:focus,.rp-field textarea:focus{outline:none;border-color:var(--purple2);}
.rp-field textarea{resize:vertical;}
.rp-r2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.rp-r3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:10px;}

.itm-hdr{
  display:grid;grid-template-columns:1fr 46px 78px 22px;gap:8px;
  font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  padding:0 2px 6px;font-weight:600;
}
.itm-row{display:grid;grid-template-columns:1fr 46px 78px 22px;gap:8px;margin-bottom:8px;align-items:center;}
.itm-row input{padding:7px 8px;border:1px solid #e2ddf0;border-radius:6px;font-size:.82rem;width:100%;}
.itm-row input.itm-desc{text-align:left;}
.itm-row input.itm-qty,.itm-row input.itm-amt{text-align:right;}
.itm-del{
  background:none;border:none;color:#c85a5a;font-size:1.15rem;line-height:1;
  width:22px;height:22px;border-radius:50%;transition:background .2s;
}
.itm-del:hover{background:#fbe4e4;}
.add-itm{
  width:100%;margin-top:4px;padding:9px;border:1.5px dashed #d8cdf0;border-radius:8px;
  background:transparent;color:var(--purple);font-weight:600;font-size:.8rem;transition:all .2s;
}
.add-itm:hover{background:var(--cream);border-color:var(--purple2);}

.print-receipt-btn{
  width:100%;padding:14px;border:none;border-radius:9px;color:#fff;
  font-weight:700;font-size:.9rem;letter-spacing:.03em;margin-top:6px;
  transition:transform .15s,box-shadow .15s;
}
.print-receipt-btn:hover{transform:translateY(-1px);}
.print-car-btn{background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 8px 22px rgba(123,47,190,.3);}
.print-tour-btn{background:linear-gradient(135deg,var(--green2),var(--green3));box-shadow:0 8px 22px rgba(45,107,45,.3);}

/* ============================================================
   RECEIPT PREVIEW / DOCUMENT
   ============================================================ */
.receipt-preview{flex:1;padding:36px 24px;display:flex;justify-content:center;min-width:0;}
.receipt-doc{width:100%;max-width:794px;background:#fff;box-shadow:0 10px 40px rgba(26,26,46,.12);overflow:hidden;color:var(--ink);align-self:flex-start;}
.receipt-doc::before{content:'';display:block;height:8px;background:linear-gradient(90deg,var(--purple),var(--green2));}
.rc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;padding:28px 40px 20px;}
.rc-brand{display:flex;gap:14px;align-items:center;}
.rc-brand img{height:62px;width:auto;max-width:110px;object-fit:contain;}
.rc-name{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.45rem;letter-spacing:.02em;line-height:1.1;}
.rc-addr{font-size:.72rem;color:var(--muted);margin-top:5px;line-height:1.6;}
.rc-doc{text-align:right;}
.rc-doc h1{font-family:'Cormorant Garamond',serif;font-size:2.1rem;letter-spacing:.14em;color:var(--purple);line-height:1;}
.rc-doc .no{font-size:.8rem;margin-top:8px;line-height:1.6;}
.rc-kind{display:inline-block;margin-top:6px;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--green2);border:1px solid var(--green2);padding:3px 10px;border-radius:20px;font-weight:600;}
.rc-body{padding:0 40px 30px;}
.rc-parties{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px;border-top:1px solid #e8e3f3;border-bottom:1px solid #e8e3f3;padding:18px 0;margin-bottom:20px;}
.rc-lbl{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--purple);font-weight:700;margin-bottom:6px;}
.rc-parties p{font-size:.88rem;line-height:1.5;}
.rc-parties p.muted{color:var(--muted);font-size:.78rem;}
.rc-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:#e8e3f3;border:1px solid #e8e3f3;border-radius:8px;overflow:hidden;margin-bottom:22px;}
.rc-strip>div{background:#faf8ff;padding:11px 14px;}
.rc-strip b{display:block;font-size:.86rem;font-weight:600;margin-top:3px;}
.rc-tw{overflow-x:auto;}
table.rc-items{width:100%;border-collapse:collapse;min-width:420px;}
table.rc-items th{background:var(--green);color:#fff;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;padding:10px 12px;text-align:left;font-weight:600;}
table.rc-items td{padding:11px 12px;border-bottom:1px solid #eee9f7;font-size:.86rem;}
table.rc-items tbody tr:nth-child(even){background:#faf8ff;}
.rc-items .num{text-align:right;white-space:nowrap;}
.rc-sum{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;margin-top:18px;}
.rc-words{flex:1;min-width:210px;font-size:.74rem;color:var(--muted);}
.rc-words b{display:block;color:var(--ink);font-size:.84rem;margin:4px 0 14px;font-weight:600;}
.rc-paid{display:inline-block;transform:rotate(-6deg);border:3px solid rgba(45,107,45,.55);color:rgba(45,107,45,.65);padding:2px 18px;border-radius:8px;font-size:1.5rem;font-weight:700;letter-spacing:.2em;font-family:'Cormorant Garamond',serif;}
.rc-totals{width:290px;max-width:100%;}
.rc-totals .row{display:flex;justify-content:space-between;padding:6px 0;font-size:.86rem;color:var(--muted);}
.rc-totals .row.grand{background:var(--green);color:#fff;padding:12px 14px;margin-top:8px;border-radius:6px;font-weight:700;font-size:1.05rem;}
.rc-sign{display:grid;grid-template-columns:1fr 1fr;gap:44px;margin-top:46px;}
.rc-sign div{border-top:1px solid var(--ink);padding-top:6px;font-size:.68rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
.rc-note{margin-top:24px;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.08rem;color:var(--green2);}
.rc-foot{background:#faf8ff;border-top:1px solid #e8e3f3;padding:14px 40px;font-size:.66rem;color:var(--muted);text-align:center;line-height:1.7;}
@media(max-width:600px){
  .rc-head,.rc-body{padding-left:18px;padding-right:18px;}.rc-foot{padding:12px 18px;}
  .rc-parties{grid-template-columns:1fr;}.rc-doc{text-align:left;}.rc-totals{width:100%;}.rc-sign{gap:22px;margin-top:36px;}
  .receipt-preview{padding:18px 10px;}.receipt-panel{padding:22px 16px 50px;}
  .rp-field input,.rp-field select,.rp-field textarea{font-size:16px;}
}

/* ============================================================
   PRINT
   ============================================================ */
@page{size:A4;margin:10mm;}
@media print{
  nav,.receipt-panel{display:none!important;}
  body{background:#fff;}
  .receipt-app{display:block;}
  .receipt-preview{padding:0;display:block;}
  .receipt-doc{box-shadow:none;max-width:none;width:100%;break-inside:avoid;}
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:860px){
  .receipt-app{flex-direction:column;}
  .receipt-panel{width:100%;max-height:none;border-right:none;border-bottom:1px solid rgba(123,47,190,.12);}
  .receipt-preview{padding:28px 16px;}
  .rd-grid2{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-text">
      <div class="pem">PEM TOURS</div>
      <div class="tours">Est. 2013 · Nakuru</div>
    </div>
  </a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="index.html#fleet">Car Hire</a>

    <a href="index.html#contact">Contact</a>

  </div>
</nav>

<div class="receipt-app">

  <!-- ══ LEFT PANEL ══ -->
  <div class="receipt-panel" id="receipt-panel">
    <div class="rp-title">Receipt Generator</div>
    <div class="rp-sub">PEM TOURS · Official Receipts</div>

    <!-- Mode toggle -->
    <div class="mode-bar">
      <button id="btn-car" class="mode-btn active" onclick="switchMode('car')">Car Hire</button>
      <button id="btn-tour" class="mode-btn" onclick="switchMode('tour')">Tour Package</button>
    </div>

    <!-- Client -->
    <div class="rp-sec">
      <div class="rp-sec-lbl">Client Details</div>
      <div class="rp-field"><label>Client Name</label><input id="client-name" value="John Kamau" oninput="renderReceipt()" /></div>
      <div class="rp-field"><label>Phone / ID No.</label><input id="client-phone" value="+254 711 987 654" oninput="renderReceipt()" /></div>
    </div>

    <!-- Car fields -->
    <div id="car-fields" class="rp-sec">

      </div>
      <div class="rp-field"><label>Pickup Location</label><input id="pickup-loc" value="Nakuru CBD" oninput="renderReceipt()" /></div>
      <div class="rp-field"><label>Drop-off Location</label><input id="drop-loc" value="Nakuru CBD" oninput="renderReceipt()" /></div>

        <div class="rp-field"><label>No. of Pax</label><input id="pax" type="number" min="1" value="2" oninput="renderReceipt()" /></div>
        <div class="rp-field"><label>Accommodation</label><input id="accommodation" value="Mara Serena Lodge" oninput="renderReceipt()" /></div>

    <!-- Items -->
    <div class="rp-sec">

      <button class="add-itm" onclick="addItem('', 1, 0)">＋ ADD CHARGE</button>

        <div class="rp-field"><label>Discount %</label><input id="discount" type="number" min="0" max="100" value="0" oninput="renderReceipt()" /></div>
        <div class="rp-field"><label>Receipt No.</label><input id="receipt-no" value="" oninput="renderReceipt()" /></div>
      </div>
      <div class="rp-field">
        <label>Payment Method</label>
        <select id="payment" onchange="renderReceipt()">
          <option>M-PESA</option>

<script>
/* ============================================================
   STATE
   ============================================================ */
let mode = 'car';
let itemCounter = 0;

/* ============================================================
   MODE SWITCH
   ============================================================ */
function switchMode(m){
  mode = m;
  document.getElementById('btn-car').classList.toggle('active', m === 'car');
  document.getElementById('btn-tour').classList.toggle('active', m === 'tour');
  document.getElementById('car-fields').style.display = m === 'car' ? 'block' : 'none';
  document.getElementById('tour-fields').style.display = m === 'tour' ? 'block' : 'none';

  const printBtn = document.getElementById('print-btn');
  printBtn.classList.toggle('print-car-btn', m === 'car');
  printBtn.classList.toggle('print-tour-btn', m === 'tour');
  printBtn.textContent = m === 'car' ? 'Print Car Hire Receipt' : 'Print Tour Package Receipt';

  renderReceipt();
}

/* ============================================================
   CHARGE ITEMS
   ============================================================ */
function addItem(desc, qty, amount){
  itemCounter++;
  const id = 'itm-' + itemCounter;
  const row = document.createElement('div');
  row.className = 'itm-row';
  row.dataset.id = id;
  row.innerHTML =
    '<input class="itm-desc" placeholder="e.g. Vehicle hire" value="' + escapeAttr(desc || '') + '" oninput="renderReceipt()">' +
    '<input class="itm-qty" type="number" min="1" value="' + (qty || 1) + '" oninput="renderReceipt()">' +
    '<input class="itm-amt" type="number" min="0" step="1" value="' + (amount || 0) + '" oninput="renderReceipt()">' +
    '<button class="itm-del" onclick="removeItem(this)" aria-label="Remove charge">×</button>';
  document.getElementById('items-wrap').appendChild(row);
  renderReceipt();
}

function removeItem(btn){
  const wrap = document.getElementById('items-wrap');
  const rows = wrap.querySelectorAll('.itm-row');
  const row = btn.closest('.itm-row');
  if(rows.length <= 1){
    // Keep at least one row — just clear it instead of removing
    row.querySelector('.itm-desc').value = '';
    row.querySelector('.itm-qty').value = 1;
    row.querySelector('.itm-amt').value = 0;
  } else {
    row.remove();
  }
  renderReceipt();
}

function getItems(){
  return Array.from(document.querySelectorAll('#items-wrap .itm-row')).map(row => {
    const desc = row.querySelector('.itm-desc').value.trim();
    const qty = parseFloat(row.querySelector('.itm-qty').value) || 0;
    const amt = parseFloat(row.querySelector('.itm-amt').value) || 0;
    return { desc, qty, amt, lineTotal: qty * amt };
  }).filter(it => it.desc || it.amt);
}

/* ============================================================
   HELPERS
   ============================================================ */
function escapeAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
function escapeHtml(s){
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtKES(n){
  return 'KES ' + Math.round(n || 0).toLocaleString('en-KE');
}
function fmtDate(dstr){
  if(!dstr) return '—';
  const d = new Date(dstr + 'T00:00:00');
  if(isNaN(d)) return dstr;
  return d.toLocaleDateString('en-KE', { day:'numeric', month:'short', year:'numeric' });
}
function daysBetween(a, b){
  if(!a || !b) return null;
  const d1 = new Date(a + 'T00:00:00');
  const d2 = new Date(b + 'T00:00:00');
  if(isNaN(d1) || isNaN(d2)) return null;
  const diff = Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
  return diff > 0 ? diff : null;
}
function val(id){
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

/* ============================================================
   RENDER RECEIPT
   ============================================================ */
function numWords(n){
  const a=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const b=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  const h=x=>x<20?a[x]:x<100?b[Math.floor(x/10)]+(x%10?'-'+a[x%10]:''):a[Math.floor(x/100)]+' hundred'+(x%100?' and '+h(x%100):'');
  if(n===0) return 'zero';
  const out=[], m=Math.floor(n/1e6), t=Math.floor(n%1e6/1e3), r=n%1e3;
  if(m) out.push(h(m)+' million'); if(t) out.push(h(t)+' thousand'); if(r) out.push(h(r));
  return out.join(' ');
}
function kesWords(v){
  const c=Math.round((Number(v)||0)*100), k=Math.floor(c/100), cents=c%100;
  const w=numWords(k);
  return 'Kenya Shillings ' + w.charAt(0).toUpperCase() + w.slice(1) + (cents ? ' and ' + numWords(cents) + ' cents' : '') + ' only';
}

function renderReceipt(){
  const items = getItems();
  const taxRate = parseFloat(val('tax-rate')) || 0;
  const discountRate = parseFloat(val('discount')) || 0;

  const subtotal = items.reduce((s, it) => s + it.lineTotal, 0);
  const discountAmt = subtotal * (discountRate / 100);
  const afterDiscount = subtotal - discountAmt;
  const taxAmt = afterDiscount * (taxRate / 100);
  const total = afterDiscount + taxAmt;

  const receiptNo = val('receipt-no') || 'PEM-' + new Date().getFullYear() + '-0000';
  const todayStr = new Date().toLocaleDateString('en-KE', { day:'numeric', month:'short', year:'numeric' });
  const clientName = val('client-name') || 'Client Name';
  const clientPhone = val('client-phone') || '';
  const payment = val('payment') || 'M-PESA';
  const note = val('note');

  let blockA, periodLbl, periodVal, extraLbl, extraVal, rdTitle;
  if(mode === 'car'){
    rdTitle = 'Car Hire';
    const days = daysBetween(val('pickup-date'), val('return-date'));
    blockA = [val('vehicle') || '—', 'Plate ' + escapeHtml(val('plate') || '—') + ' · Driver: ' + escapeHtml(val('driver') || '—')];
    periodLbl = 'Hire Period';
    periodVal = fmtDate(val('pickup-date')) + ' → ' + fmtDate(val('return-date')) + (days ? ' (' + days + ' day' + (days > 1 ? 's' : '') + ')' : '');
    extraLbl = 'Pickup → Drop-off';
    extraVal = escapeHtml(val('pickup-loc') || '—') + ' → ' + escapeHtml(val('drop-loc') || '—');
  } else {
    rdTitle = 'Tour Package';
    const days = daysBetween(val('start-date'), val('end-date'));
    blockA = [val('destination') || '—', escapeHtml(val('tour-type') || '—') + ' · ' + escapeHtml(val('pax') || '—') + ' pax'];
    periodLbl = 'Travel Dates';
    periodVal = fmtDate(val('start-date')) + ' → ' + fmtDate(val('end-date')) + (days ? ' (' + days + ' day' + (days > 1 ? 's' : '') + ')' : '');
    extraLbl = 'Accommodation';
    extraVal = escapeHtml(val('accommodation') || '—');
  }

  const itemRows = items.length
    ? items.map(it =>
        '<tr><td>' + escapeHtml(it.desc || '—') + '</td>' +
        '<td class="num">' + it.qty + '</td>' +
        '<td class="num">' + fmtKES(it.amt) + '</td>' +
        '<td class="num">' + fmtKES(it.lineTotal) + '</td></tr>'
      ).join('')
    : '<tr><td colspan="4" style="color:var(--muted);text-align:center;padding:16px 4px;">No charges added yet</td></tr>';

  const rows = [
    ['Billed To', clientName, clientPhone],
    [mode === 'car' ? 'Vehicle' : 'Destination', blockA[0], blockA[1]]
  ];
  document.getElementById('receipt-render').innerHTML =
    '<div class="receipt-doc">' +
      '<div class="rc-head">' +
        '<div class="rc-brand"><img src="images/logo.webp" alt="" onerror="this.style.display=\'none\'">' +
          '<div><div class="rc-name">PEM TOURS &amp; TRAVELLERS</div>' +
          '<div class="rc-addr">KFA, Jacaranda Business Complex, Room G32, Nakuru, Kenya<br>' +
          '+254 782 817 618 · +254 728 817 618 · info@pemtours.co.ke</div></div></div>' +
        '<div class="rc-doc"><h1>RECEIPT</h1>' +
          '<div class="no">No. <strong>' + escapeHtml(receiptNo) + '</strong><br>Date: ' + todayStr + '</div>' +
          '<span class="rc-kind">' + rdTitle + '</span></div>' +
      '</div>' +
      '<div class="rc-body">' +
        '<div class="rc-parties">' +
          '<div><div class="rc-lbl">Received From</div><p>' + escapeHtml(clientName) + '</p><p class="muted">' + escapeHtml(clientPhone) + '</p></div>' +
          '<div><div class="rc-lbl">' + rows[1][0] + '</div><p>' + escapeHtml(rows[1][1]) + '</p><p class="muted">' + rows[1][2] + '</p></div>' +
        '</div>' +
        '<div class="rc-strip">' +
          '<div><div class="rc-lbl">' + periodLbl + '</div><b>' + periodVal + '</b></div>' +
          '<div><div class="rc-lbl">' + extraLbl + '</div><b>' + extraVal + '</b></div>' +
          '<div><div class="rc-lbl">Payment Method</div><b>' + escapeHtml(payment) + '</b></div>' +
        '</div>' +
        '<div class="rc-tw"><table class="rc-items">' +
          '<thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Rate (KES)</th><th class="num">Amount (KES)</th></tr></thead>' +
          '<tbody>' + itemRows + '</tbody></table></div>' +
        '<div class="rc-sum">' +
          '<div class="rc-words"><span class="rc-paid">PAID</span><div style="margin-top:12px">Amount in words</div><b>' + kesWords(total) + '</b></div>' +
          '<div class="rc-totals">' +
            '<div class="row"><span>Subtotal</span><span>' + fmtKES(subtotal) + '</span></div>' +
            (discountRate > 0 ? '<div class="row"><span>Discount (' + discountRate + '%)</span><span>-' + fmtKES(discountAmt) + '</span></div>' : '') +
            '<div class="row"><span>VAT (' + taxRate + '%)</span><span>' + fmtKES(taxAmt) + '</span></div>' +
            '<div class="row grand"><span>Total Paid</span><span>' + fmtKES(total) + '</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="rc-sign"><div>Received by — PEM TOURS &amp; Travellers</div><div>Customer signature</div></div>' +
        (note ? '<div class="rc-note">' + escapeHtml(note) + '</div>' : '') +
      '</div>' +
      '<div class="rc-foot">Please keep this receipt as proof of payment. Valid when stamped and signed by PEM TOURS &amp; Travellers.</div>' +
    '</div>';
}

function printReceipt(){
  window.print();
}

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('receipt-no').value =
    'PEM-' + new Date().getFullYear() + '-' + String(Math.floor(1000 + Math.random() * 9000));

  addItem('Vehicle Hire — Toyota Land Cruiser V8 (per day)', 3, 15000);
});
</script>
